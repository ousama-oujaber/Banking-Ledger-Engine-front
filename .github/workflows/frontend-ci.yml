name: Frontend Monorepo CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'banking-ledger-frontend/**'
  push:
    branches: [develop, main]
    paths:
      - 'banking-ledger-frontend/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: banking-ledger-frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive Base Commit for Nx Affected
        id: set-base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_REF=origin/${{ github.base_ref }}" >> $GITHUB_ENV
          else
            echo "BASE_REF=HEAD~1" >> $GITHUB_ENV
          fi

      - name: Nx Affected Lint
        run: pnpm nx affected --target=lint --base=${{ env.BASE_REF }} --head=HEAD

      - name: Nx Affected Test
        run: pnpm nx affected --target=test --base=${{ env.BASE_REF }} --head=HEAD --coverage

      - name: Nx Affected Build
        run: pnpm nx affected --target=build --base=${{ env.BASE_REF }} --head=HEAD --configuration=production
